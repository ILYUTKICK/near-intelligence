[project]
name = "near-api"
version = "0.0.0"
description = "NEAR Intelligence FastAPI backend (runtime skeleton, NI-002)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
# Direct dependencies migrated from the reviewed requirements.in baseline
# (2026-11-05 resolution). apps/api/uv.lock is the exact frozen source; the
# lock was resolved with the baseline cutoff recorded in docs/DEPENDENCIES.md.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "PyJWT[crypto]",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Resolution cutoff reproduced from the reviewed requirements baseline
# (docs/DEPENDENCIES.md). Recorded here so every uv command — lock, --check,
# sync, export — inherits it and a bare `uv lock --check` cannot silently
# re-resolve against a newer index state.
[tool.uv]
exclude-newer = "2026-11-05T15:55:39Z"

[tool.hatch.build.targets.wheel]
packages = ["src/near_api"]
