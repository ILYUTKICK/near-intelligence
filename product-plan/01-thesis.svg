<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">01 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">Thesis</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">Почему эта инвестиционная идея может работать?</text><text x="60" y="262" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">/thesis   •   Любой посетитель; инвестор, который знакомится с NEAR.</text><rect x="60" y="299" width="330" height="34" rx="17" fill="#e5edff"/><text x="75" y="322" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">СХЕМА ОСНОВНОГО ЭКРАНА</text><rect x="60" y="346" width="1680" height="845" rx="22" fill="#e9eee5" stroke="#d4ddd3"/><rect x="84" y="370" width="1632" height="65" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="108" y="410" font-family="Inter" font-size="20" font-weight="700" fill="#152b24">NEAR / THESIS LAB</text><rect x="921" y="383" width="135" height="40" rx="10" fill="#d4f2a5"/><text x="935" y="410" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Thesis</text><text x="1080" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Data</text><text x="1225" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Model</text><text x="1370" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Strategy</text><text x="1515" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Portfolio</text><text x="108" y="489" font-family="Inter" font-size="34" font-weight="700" fill="#152b24">Проверяем инвестиционный тезис NEAR</text><text x="108" y="527" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Рост Intents → комиссии → покупки NEAR → удержание в казне</text><rect x="108" y="559" width="1584" height="112" rx="16" fill="#102a22"/><text x="135" y="595" font-family="Inter" font-size="25" font-weight="400" fill="#ffffff">Если использование Intents создаёт растущий поток покупок NEAR, а казна удерживает токены, механизм может</text><text x="135" y="630.0" font-family="Inter" font-size="25" font-weight="400" fill="#ffffff">поддерживать стоимость токена.</text><rect x="108" y="695" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="129" y="731" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H1 Возвращаемость</text><text x="129" y="770" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="129" y="806" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="644" y="695" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="665" y="731" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H2 Распределённость</text><text x="665" y="770" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="665" y="806" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="1180" y="695" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1201" y="731" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H3 Зависимость</text><text x="1201" y="770" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="1201" y="806" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="108" y="853" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="129" y="889" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H4 Доход продуктов</text><text x="129" y="928" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="129" y="964" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="644" y="853" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="665" y="889" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H5 Окупаемость</text><text x="665" y="928" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="665" y="964" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="1180" y="853" width="512" height="137" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1201" y="889" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">H6 Спрос на NEAR</text><text x="1201" y="928" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Статус + период + ограничение</text><text x="1201" y="964" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Открыть доказательства →</text><rect x="108" y="1050" width="260" height="48" rx="10" fill="#102a22"/><text x="126" y="1081" font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">Проверить данные</text><rect x="392" y="1050" width="250" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="410" y="1081" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Перейти к модели</text><text x="108" y="1145" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Что опровергнет тезис?  •  Где ещё нет данных?  •  Что изменилось?</text><text x="60" y="1225" font-family="Inter" font-size="25" font-weight="600" fill="#152b24">Понять механизм, увидеть границы доказательств и выбрать гипотезу для проверки.</text><rect x="60" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Кнопки и переходы</text><text x="88" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Проверить доказательства» → Data с hypothesis_id и общим</text><text x="108" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">периодом.</text><text x="88" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Как работает механизм» → раскрыть путь денег и определения.</text><text x="88" y="1475.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1475.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Изменить допущения» → Model с выбранной гипотезой.</text><text x="88" y="1513.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1513.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Условия пересмотра» → Strategy с тем же hypothesis_id.</text><text x="88" y="1552.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1552.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Методика и источники» → панель источников и версии расчёта.</text><rect x="920" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Состояния и поведение</text><text x="948" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Шесть гипотез имеют статусы: поддерживается / смешанные данные /</text><text x="968" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ослабляется / недостаточно данных.</text><text x="948" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Каждый статус содержит правило, период, доказательства и</text><text x="968" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ограничение.</text><text x="948" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">При устаревших данных оценка приостанавливается; показывается</text><text x="968" y="1528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">последний проверенный срез.</text><text x="948" y="1566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Неподтверждённое звено цепочки помечено как пробел.</text><text x="948" y="1604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Вывод относится к тезису; автоматический сигнал покупки не</text><text x="968" y="1631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">формируется.</text><rect x="60" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Данные и что уже есть</text><text x="88" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H1–H3: возвращаемость, распределение каналов и зависимость</text><text x="108" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">дохода требуют отдельного исследования.</text><text x="88" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H4: доход собственных продуктов требует карты получателей,</text><text x="108" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">каналов и исключения пересечений.</text><text x="88" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H5: покрытие расходов требует определения затрат и окупаемости.</text><text x="88" y="2040.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2040.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H6: повторяемые конвертации и выплаты измерены; происхождение</text><text x="108" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">комиссий подтверждено лишь в ограниченном охвате.</text><text x="88" y="2104.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2104.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Историческая опора: near-longitudinal, near-dollar,</text><text x="108" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">near-provenance, near-treasury, near-supply.</text><rect x="920" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Реализация</text><text x="948" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">UI: ThesisHero, MechanismFlow, HypothesisCard, EvidenceDrawer,</text><text x="968" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">RevisionLog.</text><text x="948" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">GET /api/thesis?period=90d → thesis_version, as_of, hypotheses,</text><text x="968" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">evidence_ids.</text><text x="948" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Редакционный реестр связывает каждое утверждение с metric_id и</text><text x="968" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">rule_version.</text><text x="948" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Статус вычисляется только для проверяемых условий; интерпретация</text><text x="968" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">имеет автора и дату.</text><text x="948" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MVP: публичная страница; фиксированный исследовательский срез и</text><text x="968" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">прозрачная дата обновления.</text><rect x="60" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Критерии готовности</text><text x="88" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Посетитель за минуту может пересказать механизм и назвать</text><text x="108" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ключевое неизвестное.</text><text x="88" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Все шесть гипотез доступны и связаны с доказательствами либо</text><text x="108" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">явным пробелом.</text><text x="88" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Нельзя получить зелёный статус при отсутствующем обязательном</text><text x="108" y="2528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">показателе.</text><text x="88" y="2566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Переход в Data сохраняет гипотезу, валюту и период.</text><text x="88" y="2604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Проверка: проследить один аргумент от карточки до исходного</text><text x="108" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">расчёта.</text><rect x="920" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">После первой версии</text><text x="948" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">История изменения выводов и причин пересмотра.</text><text x="948" y="2410.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2410.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сравнение текущего тезиса с предыдущей версией.</text><text x="948" y="2448.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2448.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Редакционное объяснение новых данных.</text><text x="948" y="2487.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2487.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Подписка на конкретную гипотезу после настройки уведомлений.</text><text x="948" y="2525.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2525.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Приоритет: доказательства H1–H5; декоративный общий балл</text><text x="968" y="2552.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">уверенности не добавляем.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План реализации • концептуальные макеты • интерфейсные значения не являются live-данными</text></svg>