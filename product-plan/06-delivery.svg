<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">06 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">Delivery / от плана к приложению</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">Порядок реализации, общие контракты, зависимости и проверка результата.</text><rect x="60" y="275" width="1680" height="144" rx="16" fill="#102a22" stroke="#d4ddd3"/><text x="88" y="316" font-family="Inter" font-size="26" font-weight="700" fill="#ffffff">01 / Основа данных</text><text x="88" y="354" font-family="Inter" font-size="21" font-weight="400" fill="#ffffff">Инвентаризация срезов; словарь метрик; события; контроль дублей, валют и периодов.</text><text x="88" y="395" font-family="Inter" font-size="19" font-weight="400" fill="#c5e1cd">Выход: проверенный dataset_version и паспорт каждой метрики.</text><rect x="60" y="439" width="1680" height="144" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="480" font-family="Inter" font-size="26" font-weight="700" fill="#152b24">02 / Thesis + Data</text><text x="88" y="518" font-family="Inter" font-size="21" font-weight="400" fill="#152b24">Публичная история тезиса, шесть гипотез, графики, события и методика.</text><text x="88" y="559" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Выход: любой вывод раскрывается до источника; пробелы видны.</text><rect x="60" y="603" width="1680" height="144" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="644" font-family="Inter" font-size="26" font-weight="700" fill="#152b24">03 / Model</text><text x="88" y="682" font-family="Inter" font-size="21" font-weight="400" fill="#152b24">Денежные потоки, сценарии, формулы, чувствительность и пригодность данных для тестов.</text><text x="88" y="723" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Выход: воспроизводимый сценарий с явными допущениями.</text><rect x="60" y="767" width="1680" height="144" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="808" font-family="Inter" font-size="26" font-weight="700" fill="#152b24">04 / Strategy</text><text x="88" y="846" font-family="Inter" font-size="21" font-weight="400" fill="#152b24">Конструктор условий, оценка состояния, версии сценариев и правил.</text><text x="88" y="887" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Выход: проверяемые условия и объяснение каждого результата.</text><rect x="60" y="931" width="1680" height="144" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="972" font-family="Inter" font-size="26" font-weight="700" fill="#152b24">05 / Portfolio</text><text x="88" y="1010" font-family="Inter" font-size="21" font-weight="400" fill="#152b24">Ручная позиция, сценарный PnL, авторизация, личное сохранение и изоляция данных.</text><text x="88" y="1051" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Выход: полный путь от тезиса до личной позиции.</text><rect x="60" y="1095" width="1680" height="144" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1136" font-family="Inter" font-size="26" font-weight="700" fill="#152b24">06 / Возврат и развитие</text><text x="88" y="1174" font-family="Inter" font-size="21" font-weight="400" fill="#152b24">История изменений, настроенные уведомления, автоматизация проверенных источников.</text><text x="88" y="1215" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Выход: причина вернуться; измеряется полезность, а не число графиков.</text><rect x="60" y="1284" width="820" height="420" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1329" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Общие сущности и контракт</text><text x="88" y="1366" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1366" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MetricDefinition: id, unit, formula, source, scope, quality и</text><text x="108" y="1392.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">freshness policy.</text><text x="88" y="1430.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1430.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Observation: metric_id, period_start/end UTC, value строкой,</text><text x="108" y="1457.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">observed_at, dataset_version.</text><text x="88" y="1495.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1495.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Evidence: event_ids, source_refs, methodology_version,</text><text x="108" y="1522.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">limitations.</text><text x="88" y="1560.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1560.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ScenarioRun: inputs, outputs, price_assumption, dataset_version,</text><text x="108" y="1586.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">model_version.</text><text x="88" y="1625.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1625.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">RuleSet / Position / JournalEntry: owner_id, version, timestamps</text><text x="108" y="1651.6000000000008" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">и ссылки на сценарий.</text><rect x="920" y="1284" width="820" height="420" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1329" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Техническая схема</text><text x="948" y="1366" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1366" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Raw snapshots → нормализованные события → проверенные агрегаты →</text><text x="968" y="1392.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">API → экраны.</text><text x="948" y="1430.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1430.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Расчётный модуль используется Model, Strategy и Portfolio;</text><text x="968" y="1457.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">формулы не дублируются в UI.</text><text x="948" y="1495.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1495.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Публичные данные и личные позиции имеют разные контуры доступа.</text><text x="948" y="1534.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1534.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Любой результат хранит версии данных, модели и правил.</text><text x="948" y="1572.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1572.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Стек и конкретные провайдеры выбираются после проверки текущего</text><text x="968" y="1598.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">репозитория и доступов.</text><rect x="60" y="1740" width="820" height="423" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1785" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Что ещё нужно исследовать</text><text x="88" y="1822" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1822" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Когорты адресов, карта сервисов, межсервисная идентичность и</text><text x="108" y="1848.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">полнота наблюдений.</text><text x="88" y="1886.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1886.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Распределение дохода по интеграторам и получателям; доля</text><text x="108" y="1913.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">собственных продуктов.</text><text x="88" y="1951.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1951.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Определение окупаемости: расходы бизнеса либо модель оценки</text><text x="108" y="1978.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">инвестиции.</text><text x="88" y="2016.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2016.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Полная атрибуция комиссий 90-дневному потоку и будущая политика</text><text x="108" y="2042.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">расходов казны.</text><text x="88" y="2081.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2081.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Механизм связи денежного потока с ценой токена и достаточность</text><text x="108" y="2107.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">данных для эконометрики.</text><rect x="920" y="1740" width="820" height="423" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1785" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Проверка полного пути</text><text x="948" y="1822" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1822" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Thesis H6 → Data с общим периодом → источник одной операции.</text><text x="948" y="1860.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1860.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Data → Model: изменить одну долю; объяснить изменение расчёта.</text><text x="948" y="1898.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1898.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Model → Strategy: добавить условие; неизвестные данные дают</text><text x="968" y="1925.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">unknown.</text><text x="948" y="1963.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1963.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Strategy → Portfolio: добавить позицию; проверить сценарный PnL.</text><text x="948" y="2002.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2002.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Войти → сохранить → открыть повторно → удалить; проверить</text><text x="968" y="2028.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">изоляцию двух пользователей.</text><rect x="60" y="2199" width="1680" height="422" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="2244" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Минимальный объём и границы релиза</text><text x="88" y="2281" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2281" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Первая рабочая версия: проверенный исторический срез, все пять разделов, денежная модель, ручные условия и агрегированная позиция.</text><text x="88" y="2319.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2319.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Когорты и эконометрика могут иметь честный статус «исследование не завершено»; интерфейс не подставляет вымышленные результаты.</text><text x="88" y="2357.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2357.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Автоматический сбор, кошельки, мультиактивность и сложная история сделок — последующие этапы после проверки полезности.</text><text x="88" y="2396.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2396.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Перед релизом: воспроизводимость расчётов, состояния ошибок и пропусков, доступность с клавиатуры и мобильная компоновка.</text><text x="88" y="2434.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2434.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Метрики продукта: понимание тезиса, переход к доказательствам, завершение сценария, применение к позиции и возврат после обновления.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План реализации • оценка сроков после выбора стека, проверки источников и уточнения команды</text></svg>