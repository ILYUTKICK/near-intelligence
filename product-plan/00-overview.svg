<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">00 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">NEAR Intents / карта продукта</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">От инвестиционной идеи к проверке доказательств и личной позиции.</text><rect x="60" y="275" width="1680" height="285" rx="16" fill="#102a22"/><text x="94" y="325" font-family="Inter" font-size="22" font-weight="700" fill="#c2e5c7">ОСНОВНОЙ ИНВЕСТИЦИОННЫЙ ТЕЗИС</text><text x="94" y="381" font-family="Inter" font-size="29" font-weight="400" fill="#ffffff">Рост использования NEAR Intents может создавать устойчивый спрос на токен NEAR: часть</text><text x="94" y="421.6" font-family="Inter" font-size="29" font-weight="400" fill="#ffffff">заработанных комиссий конвертируется в NEAR и поступает в казначейство. Если этот поток растёт и</text><text x="94" y="462.20000000000005" font-family="Inter" font-size="29" font-weight="400" fill="#ffffff">средства удерживаются, он может поддерживать стоимость токена.</text><text x="60" y="632" font-family="Inter" font-size="35" font-weight="700" fill="#152b24">Путь пользователя</text><rect x="60" y="667" width="320" height="140" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="82" y="713" font-family="Inter" font-size="30" font-weight="700" fill="#152b24">Thesis</text><text x="82" y="758" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Понять идею</text><rect x="400" y="667" width="320" height="140" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="422" y="713" font-family="Inter" font-size="30" font-weight="700" fill="#152b24">Data</text><text x="422" y="758" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Изучить факты</text><rect x="740" y="667" width="320" height="140" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="762" y="713" font-family="Inter" font-size="30" font-weight="700" fill="#152b24">Model</text><text x="762" y="758" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Проверить допущения</text><rect x="1080" y="667" width="320" height="140" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1102" y="713" font-family="Inter" font-size="30" font-weight="700" fill="#152b24">Strategy</text><text x="1102" y="758" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Задать условия</text><rect x="1420" y="667" width="320" height="140" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1442" y="713" font-family="Inter" font-size="30" font-weight="700" fill="#152b24">Portfolio</text><text x="1442" y="758" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Применить к позиции</text><text x="60" y="885" font-family="Inter" font-size="35" font-weight="700" fill="#152b24">Шесть гипотез: две стороны устойчивости</text><rect x="60" y="920" width="820" height="445" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="965" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Аудитория и каналы</text><text x="88" y="1002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H1. Интеграции формируют возвращающиеся адреса и повторное</text><text x="108" y="1028.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">использование сервисов.</text><text x="88" y="1066.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1066.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H2. Доли крупнейших каналов снижаются, а активность остальных</text><text x="108" y="1093.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">растёт.</text><text x="88" y="1131.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1131.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H3. Распределение каналов уменьшает зависимость дохода от</text><text x="108" y="1158.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">крупнейшего партнёра.</text><text x="88" y="1196.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1196.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Статус для продукта: требуется исследование когорт и проверенная</text><text x="108" y="1222.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">атрибуция интеграторов.</text><rect x="920" y="920" width="820" height="445" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="965" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Экономика и токен</text><text x="948" y="1002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H4. Собственные продукты увеличивают доход определённых</text><text x="968" y="1028.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">получателей без двойного счёта.</text><text x="948" y="1066.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1066.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H5. Текущий спрос обеспечивает выбранный критерий окупаемости</text><text x="968" y="1093.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">без дополнительного AI/privacy роста.</text><text x="948" y="1131.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1131.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">H6. Часть дохода создаёт регулярные покупки NEAR и поступления в</text><text x="968" y="1158.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">управляемую казну.</text><text x="948" y="1196.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1196.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Статус: H6 имеет наблюдаемую опору; H4–H5 требуют дополнительных</text><text x="968" y="1222.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">данных и определений.</text><rect x="60" y="1401" width="820" height="481" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1446" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Что пользователь получает</text><text x="88" y="1483" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1483" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Понятную цепочку: гипотеза → показатель → источник → расчёт →</text><text x="108" y="1509.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ограничение.</text><text x="88" y="1547.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1547.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Проверку происхождения потока: покупки, выплаты, удержание и</text><text x="108" y="1574.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">внутренние переводы раздельно.</text><text x="88" y="1612.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1612.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сценарии с явными допущениями и проверкой чувствительности.</text><text x="88" y="1651.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1651.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Собственные условия пересмотра тезиса и последствия для своей</text><text x="108" y="1677.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">позиции.</text><text x="88" y="1715.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1715.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Обещание продукта: регулярно проверять устойчивость конкретной</text><text x="108" y="1742.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">инвестиционной гипотезы.</text><rect x="920" y="1401" width="820" height="481" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1446" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Решения по первой версии</text><text x="948" y="1483" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1483" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Thesis, Data, Model и Strategy доступны без регистрации.</text><text x="948" y="1521.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1521.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Portfolio: демо и локальный расчёт; авторизация нужна для</text><text x="968" y="1547.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">постоянного личного сохранения.</text><text x="948" y="1586.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1586.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Первый релиз использует проверенный исторический срез; дата и</text><text x="968" y="1612.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">охват видимы.</text><text x="948" y="1651.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1651.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Текущая база исследования — срез 4 ноября 2026; его нельзя</text><text x="968" y="1677.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">выдавать за непрерывный live-сервис.</text><text x="948" y="1715.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1715.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Это план экранов и разработки. Готовность дизайна не означает</text><text x="968" y="1742.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">готовность приложения.</text><rect x="60" y="1918" width="1680" height="367" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1963" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Как читать этот файл</text><text x="88" y="2000" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2000" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">01 Thesis → 02 Data → 03 Model → 04 Strategy → 05 Portfolio. В каждом блоке есть схема экрана и шесть карточек требований.</text><text x="88" y="2038.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2038.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Карточки: кнопки, состояния, данные, реализация, критерии готовности и следующий этап.</text><text x="88" y="2076.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2076.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">06 Delivery объединяет порядок разработки, сущности, интерфейсы данных и проверку полного пользовательского пути.</text><text x="88" y="2115.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2115.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Мокапы показывают структуру и содержание; значения в интерфейсе обозначены как расчёты и допущения.</text><rect x="60" y="2325" width="1680" height="310" rx="16" fill="#d4f2a5"/><text x="94" y="2378" font-family="Inter" font-size="34" font-weight="700" fill="#152b24">Критерий ценности первой версии</text><text x="94" y="2430" font-family="Inter" font-size="30" font-weight="400" fill="#152b24">Посетитель может назвать, что поддерживает тезис, что остаётся неизвестным, какое допущение</text><text x="94" y="2472.0" font-family="Inter" font-size="30" font-weight="400" fill="#152b24">меняет вывод и что выбранный сценарий означает для его позиции.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План продукта v1 • 4 ноября 2026 • язык: русский • названия разделов: английский</text></svg>