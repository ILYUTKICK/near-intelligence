<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">05 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">Portfolio</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">Что выбранные сценарии означают для моей позиции?</text><text x="60" y="262" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">/portfolio   •   Держатель NEAR или человек, который рассматривает покупку.</text><rect x="60" y="299" width="330" height="34" rx="17" fill="#e5edff"/><text x="75" y="322" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">СХЕМА ОСНОВНОГО ЭКРАНА</text><rect x="60" y="346" width="1680" height="845" rx="22" fill="#e9eee5" stroke="#d4ddd3"/><rect x="84" y="370" width="1632" height="65" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="108" y="410" font-family="Inter" font-size="20" font-weight="700" fill="#152b24">NEAR / THESIS LAB</text><text x="935" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Thesis</text><text x="1080" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Data</text><text x="1225" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Model</text><text x="1370" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Strategy</text><rect x="1501" y="383" width="135" height="40" rx="10" fill="#d4f2a5"/><text x="1515" y="410" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Portfolio</text><text x="108" y="489" font-family="Inter" font-size="34" font-weight="700" fill="#152b24">Моя позиция и условия инвестиционного тезиса</text><text x="108" y="527" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Позиция / Сценарии / Мои условия / Журнал</text><rect x="108" y="561" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="128" y="590" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Моя позиция</text><text x="128" y="627" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Количество NEAR</text><text x="128" y="660" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Ручной ввод</text><rect x="509" y="561" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="529" y="590" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Себестоимость</text><text x="529" y="627" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Количество × цена входа</text><text x="529" y="660" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">В выбранной валюте</text><rect x="910" y="561" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="930" y="590" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Текущая оценка</text><text x="930" y="627" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Количество × котировка</text><text x="930" y="660" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Дата и время цены</text><rect x="1311" y="561" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1331" y="590" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Прибыль / убыток</text><text x="1331" y="627" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Оценка − себестоимость</text><text x="1331" y="660" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">С допущениями расчёта</text><rect x="108" y="705" width="990" height="337" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="133" y="747" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Что сценарии означают для позиции</text><text x="133" y="790" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Сценарий                 Цена*             Стоимость             PnL</text><rect x="133" y="812" width="940" height="47" rx="8" fill="#f4f5ef"/><text x="150" y="843" font-family="Inter" font-size="19" font-weight="400" fill="#152b24">Негативный                   Допущение       Расчёт                    Расчёт</text><rect x="133" y="870" width="940" height="47" rx="8" fill="#f4f5ef"/><text x="150" y="901" font-family="Inter" font-size="19" font-weight="400" fill="#152b24">Базовый                   Допущение       Расчёт                    Расчёт</text><rect x="133" y="928" width="940" height="47" rx="8" fill="#f4f5ef"/><text x="150" y="959" font-family="Inter" font-size="19" font-weight="400" fill="#152b24">Позитивный                   Допущение       Расчёт                    Расчёт</text><text x="133" y="1022" font-family="Inter" font-size="16" font-weight="400" fill="#60736b">* Цена задаётся пользователем либо отдельной обоснованной моделью оценки.</text><rect x="1122" y="705" width="570" height="337" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1148" y="748" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Мои условия тезиса</text><text x="1148" y="797" font-family="Inter" font-size="24" font-weight="400" fill="#152b24">Выбранная стратегия и версия</text><text x="1148" y="830.6" font-family="Inter" font-size="24" font-weight="400" fill="#152b24">сценария. Условия выполнены / не</text><text x="1148" y="864.2" font-family="Inter" font-size="24" font-weight="400" fill="#152b24">выполнены / данных недостаточно.</text><rect x="1148" y="949" width="270" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="1166" y="980" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Настроить условия</text><rect x="108" y="1066" width="260" height="48" rx="10" fill="#102a22"/><text x="126" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">Добавить позицию</text><rect x="392" y="1066" width="260" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="410" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Выбрать сценарий</text><rect x="676" y="1066" width="300" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="694" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Сохранить после входа</text><text x="108" y="1149" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Личные финансовые данные • изоляция пользователей • контроль удаления • демо подписано</text><text x="60" y="1225" font-family="Inter" font-size="25" font-weight="600" fill="#152b24">Связать исследование со своей позицией, выбранными допущениями и ограничениями риска.</text><rect x="60" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Кнопки и переходы</text><text x="88" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Добавить позицию» → количество NEAR, средняя цена входа, валюта</text><text x="108" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">и дата.</text><text x="88" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Выбрать сценарий» → сохранённая версия Model; ценовой сценарий</text><text x="108" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">задаётся явно.</text><text x="88" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Настроить условия» → RuleSet из Strategy.</text><text x="88" y="1540.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1540.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Сохранить позицию» → авторизация и личное сохранение.</text><text x="88" y="1578.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1578.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Изменить / удалить» → пересчёт; удаление личных данных доступно</text><text x="108" y="1604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">пользователю.</text><rect x="920" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Состояния и поведение</text><text x="948" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Гость видит демо и может рассчитать локальный черновик; демо</text><text x="968" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">явно подписано.</text><text x="948" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">После входа: пустая позиция / заполненная / ошибка сохранения /</text><text x="968" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">устаревшая цена.</text><text x="948" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Количество &gt; 0, средняя цена ≥ 0; прибыль в процентах недоступна</text><text x="968" y="1528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">при нулевой базе.</text><text x="948" y="1566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Цена, валюта и время котировки всегда видимы; при отсутствии</text><text x="968" y="1592.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">цены оценка не вычисляется.</text><text x="948" y="1631.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Финансовые поля не попадают в публичные ссылки, общий экспорт и</text><text x="968" y="1657.6000000000008" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">продуктовую телеметрию.</text><rect x="60" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Данные и расчёты</text><text x="88" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Cost = quantity × avg_entry; value = quantity × price; PnL =</text><text x="108" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">value − cost.</text><text x="88" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Scenario PnL = quantity × scenario_price − cost; проценты</text><text x="108" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">считаются от cost &gt; 0.</text><text x="88" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Ценовые сценарии являются допущениями либо выходом обоснованной</text><text x="108" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">модели оценки.</text><text x="88" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Для проверки личного лимита убытка нужна выбранная база и валюта</text><text x="108" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">риска.</text><text x="88" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Доля портфеля показывается только при заданной общей стоимости</text><text x="108" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">портфеля.</text><rect x="920" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Реализация</text><text x="948" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">UI: PositionForm, PositionSummary, ScenarioImpactTable,</text><text x="968" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MyConditions, Journal.</text><text x="948" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Private CRUD /api/positions, /api/scenarios, /api/rule-sets;</text><text x="968" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сервер проверяет владельца каждой записи.</text><text x="948" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MVP: ручная агрегированная позиция NEAR; отображение</text><text x="968" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">предполагает отсутствие реализованных сделок и комиссий.</text><text x="948" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Авторизация для постоянного сохранения; изоляция пользователей,</text><text x="968" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">удаление и резервное копирование.</text><text x="948" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Кошелёк, история сделок и синхронизация баланса — отдельный</text><text x="968" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">следующий этап.</text><rect x="60" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Критерии готовности</text><text x="88" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Изменение позиции пересчитывает cost, value и PnL без изменения</text><text x="108" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сценария.</text><text x="88" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Проверены нулевая база, дробные NEAR, отсутствие котировки и</text><text x="108" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">разные валюты.</text><text x="88" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Два тестовых пользователя не могут читать или менять позиции</text><text x="108" y="2528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">друг друга.</text><text x="88" y="2566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Вход, сохранение, повторное открытие и удаление проходят</text><text x="108" y="2592.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">полностью.</text><text x="88" y="2631.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Кнопка расчёта не подписывает транзакции и не выполняет сделок.</text><rect x="920" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">После первой версии</text><text x="948" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Учёт сделок, частичных продаж, комиссий и выбранного метода</text><text x="968" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">себестоимости.</text><text x="948" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Read-only подключение кошелька после определения поддерживаемых</text><text x="968" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сетей.</text><text x="948" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сравнение первоначального сценария с новыми данными.</text><text x="948" y="2540.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2540.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Личные уведомления с минимальным раскрытием финансовых данных.</text><text x="948" y="2578.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2578.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Мультиактивный портфель только после проверки пользы версии для</text><text x="968" y="2604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">NEAR.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План реализации • концептуальные макеты • интерфейсные значения не являются live-данными</text></svg>