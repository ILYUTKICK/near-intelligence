<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">02 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">Data</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">Что происходит в действительности?</text><text x="60" y="262" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">/data   •   Аналитик и инвестор, который проверяет аргументы.</text><rect x="60" y="299" width="330" height="34" rx="17" fill="#e5edff"/><text x="75" y="322" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">СХЕМА ОСНОВНОГО ЭКРАНА</text><rect x="60" y="346" width="1680" height="845" rx="22" fill="#e9eee5" stroke="#d4ddd3"/><rect x="84" y="370" width="1632" height="65" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="108" y="410" font-family="Inter" font-size="20" font-weight="700" fill="#152b24">NEAR / THESIS LAB</text><text x="935" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Thesis</text><rect x="1066" y="383" width="135" height="40" rx="10" fill="#d4f2a5"/><text x="1080" y="410" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Data</text><text x="1225" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Model</text><text x="1370" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Strategy</text><text x="1515" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Portfolio</text><text x="108" y="489" font-family="Inter" font-size="34" font-weight="700" fill="#152b24">Экономика Intents: от активности до токена</text><text x="108" y="527" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Аудитория и каналы / Доход / Покупки NEAR / Казна и предложение</text><rect x="108" y="556" width="180" height="34" rx="17" fill="#d4f2a5"/><text x="123" y="579" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">90 дней / UTC</text><rect x="304" y="556" width="175" height="34" rx="17" fill="#ffffff"/><text x="319" y="579" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">USD / NEAR</text><rect x="495" y="556" width="245" height="34" rx="17" fill="#ffffff"/><text x="510" y="579" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">Источник и качество</text><rect x="108" y="613" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="128" y="642" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Использование</text><text x="128" y="679" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Объём + динамика</text><text x="128" y="712" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Отдельный ряд</text><rect x="509" y="613" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="529" y="642" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Доход</text><text x="529" y="679" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Получатель + поток</text><text x="529" y="712" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Методика</text><rect x="910" y="613" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="930" y="642" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Покупки NEAR</text><text x="930" y="679" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">USD и NEAR</text><text x="930" y="712" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Наблюдаемые обмены</text><rect x="1311" y="613" width="377" height="120" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1331" y="642" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Удержание</text><text x="1331" y="679" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Баланс и расходы</text><text x="1331" y="712" font-family="Inter" font-size="15" font-weight="400" fill="#60736b">Охват кошельков</text><rect x="108" y="758" width="1000" height="263" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="132" y="796" font-family="Inter" font-size="22" font-weight="700" fill="#152b24">Динамика выбранного показателя</text><rect x="132" y="823" width="952" height="1" rx="0" fill="#d4ddd3"/><rect x="132" y="865" width="952" height="1" rx="0" fill="#d4ddd3"/><rect x="132" y="907" width="952" height="1" rx="0" fill="#d4ddd3"/><rect x="132" y="949" width="952" height="1" rx="0" fill="#d4ddd3"/><path d="M136 985 L308.0 923.69 L508.0 942.1 L658.0 857.94 L828.0 878.98 L1080 828" fill="none" stroke="#4c815f" stroke-width="4"/><text x="132" y="1009" font-family="Inter" font-size="14" font-weight="400" fill="#60736b">Схема графика; фактический ряд подключается из проверенного среза</text><rect x="1132" y="758" width="560" height="263" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="1156" y="797" font-family="Inter" font-size="24" font-weight="700" fill="#152b24">Качество и происхождение</text><text x="1156" y="841" font-family="Inter" font-size="23" font-weight="400" fill="#152b24">Дата среза / полнота / метод</text><text x="1156" y="873.2" font-family="Inter" font-size="23" font-weight="400" fill="#152b24">USD-оценки / границы интерпретации /</text><text x="1156" y="905.4000000000001" font-family="Inter" font-size="23" font-weight="400" fill="#152b24">ссылка на расчёт</text><rect x="1156" y="942" width="260" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="1174" y="973" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Открыть методику</text><rect x="108" y="1043" width="1584" height="102" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="132" y="1079" font-family="Inter" font-size="21" font-weight="600" fill="#152b24">Таблица операций: дата / тип / актив / сумма / tx / качество</text><text x="132" y="1118" font-family="Inter" font-size="19" font-weight="400" fill="#60736b">Открыть событие →                                      Экспортировать выбранную выборку ↓</text><text x="60" y="1225" font-family="Inter" font-size="25" font-weight="600" fill="#152b24">Исследовать сопоставимые показатели и проследить их происхождение.</text><rect x="60" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Кнопки и переходы</text><text x="88" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Фильтры: 7 / 30 / 90 дней, свой период, USD / NEAR; расчётные</text><text x="108" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">дни UTC.</text><text x="88" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Определение» → формула, единицы, охват, метод оценки и</text><text x="108" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ограничения.</text><text x="88" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Открыть операции» → таблица событий с tx/receipt и</text><text x="108" y="1528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">классификацией.</text><text x="88" y="1566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Экспорт CSV» → ровно выбранная выборка с метаданными и</text><text x="108" y="1592.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">точностью.</text><text x="88" y="1631.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Проверить в модели» → Model с metric_ids, периодом и</text><text x="108" y="1657.6000000000008" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">dataset_version.</text><rect x="920" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Состояния и поведение</text><text x="948" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Отдельно: загрузка / нет наблюдений / недостаточный охват /</text><text x="968" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">ошибка / устаревший срез.</text><text x="948" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Нулевое значение показывается только при подтверждённом нуле;</text><text x="968" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">пропуск остаётся пропуском.</text><text x="948" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сравниваются полные окна одинаковой длительности; неполный</text><text x="968" y="1528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">текущий день выделен.</text><text x="948" y="1566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Дневная USD-оценка имеет метку «приблизительно».</text><text x="948" y="1604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Интерфейс адаптивный: фильтры сворачиваются, таблица скроллится,</text><text x="968" y="1631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">определения доступны с клавиатуры.</text><rect x="60" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Данные и ограничения</text><text x="88" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MVP: покупки, выплаты, USD-оценка, баланс казны, net supply;</text><text x="108" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">использовать сохранённые выгрузки.</text><text x="88" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Адреса не приравниваются к людям; аккаунты сборщиков не</text><text x="108" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">приравниваются к интеграторам.</text><text x="88" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Комиссии всех сервисов и доход конкретного получателя имеют</text><text x="108" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">разные определения.</text><text x="88" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Покупки и выплаты не суммируются; внутренние переводы казны</text><text x="108" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">исключаются из новых поступлений.</text><text x="88" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Mint и burn сейчас имеют нижние границы; сравнение с эмиссией не</text><text x="108" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">измеряет рыночное давление продаж.</text><rect x="920" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Реализация</text><text x="948" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">UI: MetricCard, PeriodFilter, UnitSwitch, TimeSeriesChart,</text><text x="968" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">LedgerTable, SourceDrawer.</text><text x="948" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">GET /api/metrics; GET /api/series?metric_id=...; GET</text><text x="968" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">/api/events?cursor=...</text><text x="948" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Слой данных: raw snapshots → нормализованные события → дневные</text><text x="968" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">агрегаты → API.</text><text x="948" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Ключ события: сеть + tx + receipt + log/item index; дедупликация</text><text x="968" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">и успешность исполнения.</text><text x="948" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Raw amounts хранятся целыми строками; расчёты Decimal;</text><text x="968" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">обновление атомарным проверенным срезом.</text><rect x="60" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Критерии готовности</text><text x="88" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Любая цифра имеет определение, источник, as_of, период, охват и</text><text x="108" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">quality_status.</text><text x="88" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Покупки и казначейские переводы сходятся с сохранёнными</text><text x="108" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">контрольными суммами.</text><text x="88" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">CSV и экран используют одинаковые фильтры, точность и версии.</text><text x="88" y="2540.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2540.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Ошибка источника сохраняет последний успешный срез и явно</text><text x="108" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сообщает о задержке.</text><text x="88" y="2604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Проверка: воспроизвести 30-дневный показатель из событий,</text><text x="108" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">включая внутренний перевод и дубликат.</text><rect x="920" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">После первой версии</text><text x="948" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Когорты повторного использования 7 / 30 / 90 дней после проверки</text><text x="968" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">идентичности адресов.</text><text x="948" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Версионированная карта интеграторов и доли каналов по доходу.</text><text x="948" y="2475.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2475.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сверка источников и объяснение расхождений с внешними</text><text x="968" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">дашбордами.</text><text x="948" y="2540.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2540.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Автоматическое обновление с контролем лимитов, стоимости и</text><text x="968" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">полноты.</text><text x="948" y="2604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Новые массовые RPC/облачные сборы планируются отдельно;</text><text x="968" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">остановленные сборщики не возобновляются автоматически.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План реализации • концептуальные макеты • интерфейсные значения не являются live-данными</text></svg>