<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120"><rect x="0" y="0" width="1440" height="1120" rx="0" fill="#F5F6F0"/><rect x="0" y="0" width="1440" height="91" rx="0" fill="#F5F6F0"/><rect x="64" y="36" width="7" height="15" rx="2" fill="#17372B"/><rect x="74" y="22" width="7" height="29" rx="2" fill="#17372B"/><rect x="84" y="29" width="7" height="22" rx="2" fill="#17372B"/><text x="107" y="49" font-family="Inter" font-size="20" font-weight="700" fill="#17372B">NEAR THESIS LAB</text><rect x="550" y="24" width="100" height="43" rx="9" fill="#FFFFFF"/><text x="569" y="52" font-family="Inter" font-size="17" font-weight="500" fill="#17372B">Тезис</text><text x="677" y="52" font-family="Inter" font-size="17" font-weight="500" fill="#65766B">Доказательства</text><text x="875" y="52" font-family="Inter" font-size="17" font-weight="500" fill="#65766B">Сценарии</text><text x="1200" y="37" font-family="Inter" font-size="11" font-weight="600" fill="#65766B">NEAR HACKATHON</text><text x="1200" y="55" font-family="Inter" font-size="10" font-weight="400" fill="#65766B">INVESTMENT THESIS</text><rect x="0" y="90" width="1440" height="1" rx="0" fill="#DDE3D8"/><rect x="65" y="127" width="7" height="7" rx="4" fill="#57815D"/><text x="82" y="135" font-family="Inter" font-size="13" font-weight="400" fill="#65766B">Исследование от 04.11.2026</text><text x="1053" y="135" font-family="Inter" font-size="13" font-weight="400" fill="#65766B">Данные: 06.08–03.11.2026 · UTC</text><text x="64" y="202" font-family="Inter" font-size="13" font-weight="600" fill="#65766B">ОТ АКТИВНОСТИ — К ЦЕННОСТИ ТОКЕНА</text><text x="61" y="287" font-family="Inter" font-size="66" font-weight="500" fill="#17372B">Что рост Intents</text><text x="61" y="364" font-family="Inter" font-size="66" font-weight="500" fill="#57815D">значит для NEAR?</text><text x="64" y="419" font-family="Inter" font-size="22" font-weight="400" fill="#65766B">Часть комиссий может превращаться в покупки NEAR.</text><text x="64" y="453.1" font-family="Inter" font-size="22" font-weight="400" fill="#65766B">Проверьте доказательства и узнайте, какой спрос создаёт ваш</text><text x="64" y="487.20000000000005" font-family="Inter" font-size="22" font-weight="400" fill="#65766B">сценарий роста.</text><rect x="64" y="541" width="315" height="55" rx="10" fill="#173D2D"/><text x="85" y="576" font-family="Inter" font-size="17" font-weight="500" fill="#FFFFFF">Проверить свой сценарий  →</text><text x="404" y="576" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">Сначала доказательства →</text><text x="64" y="624" font-family="Inter" font-size="14" font-weight="400" fill="#65766B">Наблюдения, оценки и ваши допущения — отдельно.</text><rect x="817" y="185" width="559" height="444" rx="20" fill="#FFFFFF" stroke="#DDE3D8"/><text x="845" y="220" font-family="Inter" font-size="12" font-weight="600" fill="#65766B">ПУТЬ ЦЕННОСТИ</text><text x="1183" y="220" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">Последние 30 дней</text><rect x="844" y="255" width="31" height="31" rx="16" fill="#E9EEE4"/><text x="852" y="276" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">01</text><text x="889" y="268" font-family="Inter" font-size="17" font-weight="500" fill="#17372B">Объём Intents</text><text x="889" y="293" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">Обмены через протокол</text><text x="1152" y="280" font-family="Inter" font-size="28" font-weight="500" fill="#17372B">$3,97 млрд</text><rect x="845" y="313" width="503" height="1" rx="0" fill="#DDE3D8"/><rect x="844" y="341" width="31" height="31" rx="16" fill="#E9EEE4"/><text x="852" y="362" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">02</text><text x="889" y="354" font-family="Inter" font-size="17" font-weight="500" fill="#17372B">Все комиссии</text><text x="889" y="379" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">По данным NEAR Dashboard</text><text x="1152" y="366" font-family="Inter" font-size="28" font-weight="500" fill="#17372B">$5,92 млн</text><rect x="845" y="399" width="503" height="1" rx="0" fill="#DDE3D8"/><rect x="845" y="426" width="503" height="39" rx="8" fill="#F6EDCF"/><text x="857" y="451" font-family="Inter" font-size="12" font-weight="400" fill="#76622C">Связь комиссий с покупками подтверждена частично</text><rect x="844" y="496" width="31" height="31" rx="16" fill="#E9EEE4"/><text x="852" y="517" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">03</text><text x="889" y="509" font-family="Inter" font-size="17" font-weight="500" fill="#17372B">Покупки NEAR</text><text x="889" y="534" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">Приблизительная USD-оценка</text><text x="1147" y="521" font-family="Inter" font-size="28" font-weight="500" fill="#17372B">≈ $547 тыс.</text><rect x="845" y="565" width="503" height="41" rx="9" fill="#E9EEE4"/><text x="859" y="591" font-family="Inter" font-size="14" font-weight="400" fill="#17372B">Дальше — удержание в казне</text><text x="1228" y="591" font-family="Inter" font-size="12" font-weight="400" fill="#17372B">Проверить →</text><text x="64" y="706" font-family="Inter" font-size="30" font-weight="500" fill="#17372B">Что уже говорят данные</text><text x="989" y="706" font-family="Inter" font-size="13" font-weight="400" fill="#65766B">У каждого вывода — свои доказательства</text><rect x="64" y="738" width="420" height="258" rx="18" fill="#FFFFFF" stroke="#DDE3D8"/><rect x="88" y="761" width="105.0" height="29" rx="7" fill="#E9EEE4"/><text x="99" y="781" font-family="Inter" font-size="13" font-weight="400" fill="#17372B">Наблюдается</text><text x="88" y="827" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">Покупки происходят</text><text x="88" y="855.8" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">регулярно</text><text x="88" y="896" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">Конвертации в NEAR есть во все 90 дней</text><text x="88" y="919.2" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">проверенного периода.</text><text x="88" y="970" font-family="Inter" font-size="14" font-weight="400" fill="#17372B">Посмотреть подтверждение →</text><rect x="510" y="738" width="420" height="258" rx="18" fill="#FFFFFF" stroke="#DDE3D8"/><rect x="534" y="761" width="153.0" height="29" rx="7" fill="#F6EDCF"/><text x="545" y="781" font-family="Inter" font-size="13" font-weight="400" fill="#76622C">Рост не подтверждён</text><text x="534" y="827" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">Долларовый поток</text><text x="534" y="855.8" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">почти не вырос</text><text x="534" y="896" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">Около $547 тыс. за последние 30 дней против</text><text x="534" y="919.2" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">$558 тыс. за предыдущие.</text><text x="534" y="970" font-family="Inter" font-size="14" font-weight="400" fill="#17372B">Сравнить периоды →</text><rect x="956" y="738" width="420" height="258" rx="18" fill="#FFFFFF" stroke="#DDE3D8"/><rect x="980" y="761" width="130.0" height="29" rx="7" fill="#E9E7F2"/><text x="991" y="781" font-family="Inter" font-size="13" font-weight="400" fill="#17372B">Есть ограничение</text><text x="980" y="827" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">Происхождение раскрыто</text><text x="980" y="855.8" font-family="Inter" font-size="24" font-weight="500" fill="#17372B">частично</text><text x="980" y="896" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">Комиссионное финансирование найдено. Полной</text><text x="980" y="919.2" font-family="Inter" font-size="16" font-weight="400" fill="#65766B">атрибуции потока пока нет.</text><text x="980" y="970" font-family="Inter" font-size="14" font-weight="400" fill="#17372B">Разобраться в ограничениях →</text><rect x="64" y="1038" width="1312" height="1" rx="0" fill="#DDE3D8"/><text x="64" y="1075" font-family="Inter" font-size="13" font-weight="400" fill="#65766B">Исследуйте аргументы. Проверяйте допущения.</text><text x="695" y="1075" font-family="Inter" font-size="13" font-weight="400" fill="#65766B">Методика и источники →</text><text x="1150" y="1075" font-family="Inter" font-size="12" font-weight="400" fill="#65766B">Прототип · исторический срез</text></svg>