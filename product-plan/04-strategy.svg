<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920"><rect x="0" y="0" width="1800" height="2920" rx="0" fill="#f4f5ef"/><rect x="60" y="48" width="250" height="34" rx="17" fill="#d4f2a5"/><text x="75" y="71" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">04 / PRODUCT PLAN</text><text x="60" y="151" font-family="Inter" font-size="64" font-weight="700" fill="#152b24">Strategy</text><text x="60" y="204" font-family="Inter" font-size="25" font-weight="400" fill="#60736b">При каких условиях пересматривать инвестиционное решение?</text><text x="60" y="262" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">/strategy   •   Инвестор, который формулирует собственные правила.</text><rect x="60" y="299" width="330" height="34" rx="17" fill="#e5edff"/><text x="75" y="322" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">СХЕМА ОСНОВНОГО ЭКРАНА</text><rect x="60" y="346" width="1680" height="845" rx="22" fill="#e9eee5" stroke="#d4ddd3"/><rect x="84" y="370" width="1632" height="65" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="108" y="410" font-family="Inter" font-size="20" font-weight="700" fill="#152b24">NEAR / THESIS LAB</text><text x="935" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Thesis</text><text x="1080" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Data</text><text x="1225" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Model</text><rect x="1356" y="383" width="135" height="40" rx="10" fill="#d4f2a5"/><text x="1370" y="410" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Strategy</text><text x="1515" y="410" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Portfolio</text><text x="108" y="489" font-family="Inter" font-size="34" font-weight="700" fill="#152b24">Стратегия, которую можно проверить</text><text x="108" y="527" font-family="Inter" font-size="20" font-weight="400" fill="#60736b">Сценарий → условия → наблюдение → пересмотр → журнал решения</text><rect x="108" y="561" width="345" height="34" rx="17" fill="#d4f2a5"/><text x="123" y="584" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">Сценарий: выбранная версия</text><rect x="473" y="561" width="335" height="34" rx="17" fill="#ffffff"/><text x="488" y="584" font-family="Inter" font-size="17" font-weight="600" fill="#152b24">Период и свежесть данных</text><rect x="108" y="618" width="990" height="423" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="133" y="661" font-family="Inter" font-size="27" font-weight="700" fill="#152b24">Мои условия</text><rect x="133" y="689" width="940" height="80" rx="10" fill="#f4f5ef"/><text x="151" y="720" font-family="Inter" font-size="22" font-weight="600" fill="#152b24">Поток покупок растёт</text><text x="151" y="749" font-family="Inter" font-size="17" font-weight="400" fill="#60736b">Метрика / окно / порог</text><text x="916" y="734" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Оценить</text><rect x="133" y="787" width="940" height="80" rx="10" fill="#f4f5ef"/><text x="151" y="818" font-family="Inter" font-size="22" font-weight="600" fill="#152b24">Подтверждение происхождения</text><text x="151" y="847" font-family="Inter" font-size="17" font-weight="400" fill="#60736b">Охват / методика</text><text x="916" y="832" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Оценить</text><rect x="133" y="885" width="940" height="80" rx="10" fill="#f4f5ef"/><text x="151" y="916" font-family="Inter" font-size="22" font-weight="600" fill="#152b24">Удержание в казне</text><text x="151" y="945" font-family="Inter" font-size="17" font-weight="400" fill="#60736b">Период / политика расходов</text><text x="916" y="930" font-family="Inter" font-size="18" font-weight="400" fill="#152b24">Оценить</text><rect x="1122" y="618" width="570" height="423" rx="16" fill="#102a22"/><text x="1148" y="662" font-family="Inter" font-size="26" font-weight="700" fill="#ffffff">Объяснение состояния</text><text x="1148" y="711" font-family="Inter" font-size="25" font-weight="400" fill="#ffffff">Какие условия выполнены? Какие</text><text x="1148" y="746.0" font-family="Inter" font-size="25" font-weight="400" fill="#ffffff">данные отсутствуют? Что заставит</text><text x="1148" y="781.0" font-family="Inter" font-size="25" font-weight="400" fill="#ffffff">пересмотреть выбранную стратегию?</text><text x="1148" y="881" font-family="Inter" font-size="22" font-weight="400" fill="#c9dfcf">Каждый результат раскрывается до</text><text x="1148" y="911.8" font-family="Inter" font-size="22" font-weight="400" fill="#c9dfcf">правила, показателя и источника.</text><rect x="108" y="1066" width="250" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="126" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Добавить условие</text><rect x="380" y="1066" width="260" height="48" rx="10" fill="#102a22"/><text x="398" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">Проверить сейчас</text><rect x="664" y="1066" width="290" height="48" rx="10" fill="#ffffff" stroke="#d4ddd3"/><text x="682" y="1097" font-family="Inter" font-size="18" font-weight="600" fill="#152b24">Применить к позиции</text><text x="108" y="1149" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">Журнал: когда изменилось условие, что показали данные и какое решение сохранил пользователь</text><text x="60" y="1225" font-family="Inter" font-size="25" font-weight="600" fill="#152b24">Превратить выбранный сценарий в прозрачные условия наблюдения, входа и пересмотра.</text><rect x="60" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Кнопки и переходы</text><text x="88" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Выбрать сценарий» → версия сценария из Model.</text><text x="88" y="1410.4" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1410.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Добавить условие» → показатель, оператор, порог, окно и число</text><text x="108" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">подтверждений.</text><text x="88" y="1475.2000000000003" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1475.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Проверить сейчас» → результат для каждого условия и объяснение.</text><text x="88" y="1513.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1513.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Применить к позиции» → Portfolio с rule_set_id и scenario_id.</text><text x="88" y="1552.0000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1552.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">«Сохранить правила» → вход и сохранение; «История» → изменения с</text><text x="108" y="1578.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">датами.</text><rect x="920" y="1290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Состояния и поведение</text><text x="948" y="1372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Каждое условие: выполнено / не выполнено / недостаточно данных /</text><text x="968" y="1398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">устарело.</text><text x="948" y="1436.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1436.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Пример правила: долларовые покупки растут в нескольких</text><text x="968" y="1463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сопоставимых окнах; пороги задаёт пользователь.</text><text x="948" y="1501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Отдельно задаются условия рассмотрения входа и условия</text><text x="968" y="1528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">пересмотра тезиса.</text><text x="948" y="1566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Комбинации AND / OR видимы; правило не исполняется на устаревших</text><text x="968" y="1592.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">данных.</text><text x="948" y="1631.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Изменение модели не меняет сохранённую стратегию: показывается</text><text x="968" y="1657.6000000000008" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">предложение пересмотреть версию.</text><rect x="60" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Данные и правила</text><text x="88" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Вход: scenario_id, metric_id, operator, threshold, window,</text><text x="108" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">confirmations, freshness_limit.</text><text x="88" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Порог является предпочтением пользователя либо явно подписанным</text><text x="108" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">примером.</text><text x="88" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Контекст риска: горизонт, допустимый убыток и условия отмены</text><text x="108" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">собственных допущений.</text><text x="88" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Текущие наблюдения привязаны к единому dataset_version.</text><text x="88" y="2104.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2104.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Историческая проверка различает отсутствие данных и невыполнение</text><text x="108" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">условия.</text><rect x="920" y="1790" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="1835" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Реализация</text><text x="948" y="1872" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1872" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">UI: ScenarioPicker, RuleBuilder, ConditionStatus,</text><text x="968" y="1898.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">RuleExplanation, DecisionJournal.</text><text x="948" y="1936.8000000000002" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="1936.8000000000002" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">POST /api/strategy/evaluate → statuses, evidence, evaluated_at,</text><text x="968" y="1963.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">versions.</text><text x="948" y="2001.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2001.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Rule engine вычисляет логические условия, полноту окна и</text><text x="968" y="2028.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">свежесть метрик.</text><text x="948" y="2066.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2066.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Сохранение RuleSet и RuleVersion; изменения фиксируются,</text><text x="968" y="2092.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">предыдущие версии доступны.</text><text x="948" y="2131.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2131.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">MVP: ручная проверка правил; торговые операции и исполнение</text><text x="968" y="2157.600000000001" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">сделок в объём версии не входят.</text><rect x="60" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="88" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">Критерии готовности</text><text x="88" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Из каждого статуса можно открыть конкретный показатель, порог,</text><text x="108" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">период и правило.</text><text x="88" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Недостаточные данные дают unknown, а не false или зелёный общий</text><text x="108" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">статус.</text><text x="88" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Проверены AND / OR, точная граница порога, неполные окна и</text><text x="108" y="2528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">устаревший источник.</text><text x="88" y="2566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">При переходе в Portfolio сохраняются идентификаторы сценария и</text><text x="108" y="2592.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">правил.</text><text x="88" y="2631.2000000000007" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="108" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Пользователь может объяснить условие пересмотра своими словами.</text><rect x="920" y="2290" width="820" height="480" rx="16" fill="#ffffff" stroke="#d4ddd3"/><text x="948" y="2335" font-family="Inter" font-size="25" font-weight="700" fill="#152b24">После первой версии</text><text x="948" y="2372" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2372" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Уведомления только при значимом переходе состояния и после</text><text x="968" y="2398.4" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">настройки пользователем.</text><text x="948" y="2436.8" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2436.8" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Историческая проверка с комиссиями, проскальзыванием и</text><text x="968" y="2463.2000000000003" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">разделением обучения/проверки.</text><text x="948" y="2501.6000000000004" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2501.6000000000004" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Временные правила должны использовать только данные, доступные</text><text x="968" y="2528.0000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">на тот момент.</text><text x="948" y="2566.4000000000005" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2566.4000000000005" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Шаблоны стратегий публикуются с объяснением выбора порогов.</text><text x="948" y="2604.8000000000006" font-family="Inter" font-size="21" font-weight="400" fill="#60736b">•</text><text x="968" y="2604.8000000000006" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">Журнал причин решения и сравнение результата с исходными</text><text x="968" y="2631.2000000000007" font-family="Inter" font-size="20" font-weight="400" fill="#152b24">предположениями.</text><text x="60" y="2878" font-family="Inter" font-size="18" font-weight="400" fill="#60736b">План реализации • концептуальные макеты • интерфейсные значения не являются live-данными</text></svg>